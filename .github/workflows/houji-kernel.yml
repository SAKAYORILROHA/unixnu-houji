name: houji XNU kernel

# Build the Xiaomi 14 (houji) XNU kernel on a macOS runner.
# Actions -> houji XNU kernel -> Run workflow. Artifact: houji-kernel-<run>
# (kernel.macho + the linked raw kernel + trimmed logs).

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version installed on macos-26"
        required: true
        default: "26.6"
      jobs:
        description: "parallel compile jobs"
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEVICE_DIR: ${{ github.workspace }}/device
      # prepare-xnu-source.py reads api.github.com; authenticated calls avoid the shared-IP rate limit
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: Checkout houji device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          command -v unifdef >/dev/null || brew install unifdef

      - name: Validate runner
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          for tool in git make clang cmake ninja unifdef; do command -v "$tool"; done

      - name: Configure, fetch and assemble sources
        working-directory: unixnu
        run: |
          ./unixnu defconfig houji_defconfig -D "$DEVICE_DIR"
          ./unixnu fetch -D "$DEVICE_DIR"
          ./unixnu tree -D "$DEVICE_DIR"
          ./unixnu status -D "$DEVICE_DIR"

      - name: Build XNU kernel
        working-directory: unixnu
        run: |
          ./unixnu build kernel -D "$DEVICE_DIR" -j "${{ inputs.jobs }}"

      - name: Prelink with the iOS 16.7.16 / 20H392 kernelcache
        continue-on-error: true
        working-directory: unixnu
        run: |
          ./unixnu build prelink -D "$DEVICE_DIR"

      - name: Collect a small artifact
        if: always()
        run: |
          mkdir -p artifact/logs artifact/kernel artifact/raw
          for f in unixnu/out/houji/logs/*.log; do
            [ -f "$f" ] || continue
            tail -n 2000 "$f" > "artifact/logs/$(basename "$f")"
          done
          cp -a unixnu/out/houji/kernel/. artifact/kernel/ 2>/dev/null || true
          find unixnu/out/houji/tree/build/xnu/ios-obj -maxdepth 3 -name 'mach.*' -size +1M \
            -exec cp {} artifact/raw/ \; 2>/dev/null || true
          cp device/unixnu.lock artifact/ 2>/dev/null || true
          du -sh artifact; find artifact -type f | head -30

      - name: Upload kernel and trimmed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houji-kernel-${{ github.run_number }}
          include-hidden-files: true
          if-no-files-found: warn
          path: artifact/**
